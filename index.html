<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ của bé">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sổ của bé 🍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  box-sizing:border-box;
  --bg:#f8fafc;
  --paper:#ffffff;
  --ink:#1e293b;
  --muted:#64748b;
  --line:#e2e8f0;
  
  /* Bảng màu Xanh Dương - Tươi sáng, sạch sẽ, không dùng hồng */
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --primary-soft:#eff6ff;
  --primary-border:#bfdbfe;
  
  --butter:#f59e0b;
  --butter-soft:#fffbeb;
  --mint:#10b981;
  --mint-soft:#ecfdf5;
  --purple:#8b5cf6;
  --purple-soft:#f5f3ff;
  --coral:#f97316;
  --coral-soft:#fff7ed;
  --danger:#ef4444;
  
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow:0 4px 16px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-sm:0 2px 8px -2px rgba(15, 23, 42, 0.06);

  /* Header & Footer translucent */
  --bar-bg:rgba(248, 250, 252, 0.88);
  --bar-border:#e2e8f0;
} /* <-- ĐÓNG DẤU NGOẶC CỦA :root Ở ĐÂY */

/* Ẩn thanh cuộn trên toàn bộ trình duyệt (Chrome, Safari, iOS, Firefox) */
html, body, #app, #sheet .pn, .seg {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE, Edge */
}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
#app::-webkit-scrollbar,
#sheet .pn::-webkit-scrollbar,
.seg::-webkit-scrollbar {
  display: none; /* Chrome, Safari, iOS Safari */
  width: 0px;
  background: transparent;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a;
    --paper:#1e293b;
    --ink:#f8fafc;
    --muted:#94a3b8;
    --line:#334155;
    
    --primary:#3b82f6;
    --primary-hover:#60a5fa;
    --primary-soft:#1e3a5f;
    --primary-border:#1d4ed8;
    
    --butter:#fbbf24;
    --butter-soft:#2d2410;
    --mint:#34d399;
    --mint-soft:#132e27;
    --purple:#a78bfa;
    --purple-soft:#28203c;
    --coral:#fb923c;
    --coral-soft:#332216;
    --danger:#f87171;
    
    --bar-bg:rgba(15, 23, 42, 0.88);
    --bar-border:#334155;
    --shadow:0 6px 18px rgba(0, 0, 0, 0.3);
    --shadow-sm:0 2px 8px rgba(0, 0, 0, 0.2);
  }
}

html{
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
*,*::before,*::after{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans","Be Vietnam Pro",-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform 0.1s ease, opacity 0.1s ease}
button:active{transform:scale(0.97);opacity:0.9}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:10px}

#app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom, 12px));
  position:relative;
}

/* TOP HEADER - Đồng bộ mờ theo theme */
.top{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bar-bg);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bar-border);
  padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  display:flex;
  align-items:center;
  gap:12px;
}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em;line-height:1.2}
.top p{margin:0;color:var(--primary);font-size:13px;font-weight:600}
.top .who{flex:1;min-width:0}
.icon-btn{
  width:40px;height:40px;border-radius:14px;
  background:var(--paper);box-shadow:var(--shadow-sm);
  display:grid;place-items:center;font-size:18px;
  border:1px solid var(--line);
}

main{padding:12px 14px}
section{margin-bottom:16px}
.sec-title{font-size:15px;font-weight:800;margin:0 2px 8px;color:var(--ink);display:flex;align-items:center;gap:6px}

/* Cards */
.card{
  background:var(--paper);border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);
}

/* Growth Strip */
.strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--paper);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);
}
.strip>div{padding:14px 8px 12px;border-right:1px solid var(--line);text-align:center}
.strip>div:last-child{border-right:0}
.strip .k{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.strip .v{font-size:24px;font-weight:800;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.strip .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.strip .d{font-size:11px;margin-top:4px;color:var(--muted);font-weight:600}
.strip .d.up{color:var(--primary);font-weight:700}
.strip .w .v{color:var(--primary)}
.strip>div.empty .v{color:var(--line)}

/* Stats Grid */
.grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{
  border-radius:var(--radius-md);padding:14px;
  box-shadow:var(--shadow-sm);border:1px solid transparent;
}
.mini.milk{background:var(--butter-soft);border-color:rgba(245,158,11,0.25)}
.mini.sleep{background:var(--purple-soft);border-color:rgba(139,92,246,0.25)}
.mini.pump{background:var(--coral-soft);border-color:rgba(249,115,22,0.25)}
.mini.diaper{background:var(--mint-soft);border-color:rgba(16,185,129,0.25)}
.mini .k{font-size:12px;color:var(--ink);font-weight:700;opacity:0.85}
.mini .v{font-size:21px;font-weight:800;margin-top:3px}
.mini.milk .v{color:var(--butter)}
.mini.sleep .v{color:var(--purple)}
.mini.pump .v{color:var(--coral)}
.mini.diaper .v{color:var(--mint)}
.mini .v small{font-size:12px;font-weight:600;opacity:0.85}

/* Quick Actions */
.quick{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 14px;border-radius:var(--radius-md);
  font-weight:700;font-size:14px;background:var(--primary);color:#fff;
  box-shadow:0 3px 10px rgba(37,99,235,0.28);
}
.btn:active{background:var(--primary-hover)}
.btn.ghost{background:var(--primary-soft);color:var(--primary);box-shadow:none;border:1px solid var(--primary-border)}
.btn.wide{width:100%}
.btn.danger{background:rgba(239,68,68,0.1);color:var(--danger);box-shadow:none;border:1px solid rgba(239,68,68,0.25)}
.btn.small{min-height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.btn.plain{background:transparent;color:var(--primary);min-height:38px;box-shadow:none}

.btn-google{
  background:var(--paper);color:var(--ink);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);font-weight:700;font-size:14.5px;
}

/* Segments */
.seg{
  display:flex;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto;
}
.seg button{
  flex:1;min-height:36px;border-radius:10px;font-weight:700;
  font-size:13px;color:var(--muted);white-space:nowrap;padding:0 10px;
}
.seg button[aria-pressed="true"]{
  background:var(--primary);color:#ffffff;box-shadow:0 2px 6px rgba(37,99,235,0.25);
}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--muted);font-size:10px;font-weight:600}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--paper);stroke:var(--primary);stroke-width:2.5}
.chart .val{fill:var(--primary);font-weight:700;font-size:11px}

/* List items */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;background:var(--paper);
  border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm);
  border:1px solid var(--line);
}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.row .x{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:15px;display:grid;place-items:center}
.row .x:active{background:rgba(239,68,68,0.1);color:var(--danger)}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between}

.chip{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;
  border-radius:99px;background:var(--primary-soft);color:var(--primary);margin-right:6px;
}
.chip.t-tiem{background:var(--mint-soft);color:var(--mint)}
.chip.t-thai{background:var(--coral-soft);color:var(--coral)}
.chip.t-khac{background:var(--butter-soft);color:var(--butter)}
.chip.t-fever{background:rgba(239,68,68,0.1);color:var(--danger)}
.late{color:var(--danger);font-weight:700}

.check{
  width:28px;height:28px;border-radius:10px;border:2px solid var(--line);
  display:grid;place-items:center;flex:none;color:transparent;font-weight:900;
  font-size:14px;background:var(--bg);
}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#fff}
.done .t{text-decoration:line-through;color:var(--muted);opacity:0.7}

.empty-note{
  text-align:center;color:var(--muted);padding:24px 14px;
  border:1.5px dashed var(--line);border-radius:var(--radius-lg);font-weight:500;
}
.empty-note b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px;font-weight:700}

/* TABS FOOTER - Khử màu trắng, đồng bộ mờ theo theme */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--bar-bg);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bar-border);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom, 12px));
}
.tabs div{
  max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
}
.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0 4px;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:12px;
}
.tabs button span{font-size:19px;line-height:1;opacity:0.6}
.tabs button[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
.tabs button[aria-current="page"] span{opacity:1;transform:scale(1.08)}

/* Modal Sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
#sheet .bd{
  position:absolute;inset:0;background:rgba(15,23,42,0.45);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#sheet .pn{
  position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:var(--paper);border-radius:26px 26px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom, 12px));
  max-height:88vh;overflow-y:auto;animation:up 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 14px;font-size:18px;font-weight:800;text-align:center}

.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:5px;opacity:0.85}
.f input,.f select,.f textarea{
  width:100%;font-size:15px;font-weight:500;padding:11px 12px;border-radius:14px;
  border:1px solid var(--line);background:var(--bg);min-height:44px;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary);background:var(--paper)}
.f textarea{min-height:84px;resize:vertical}
.err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:18px;margin:-2px 0 6px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 10px;line-height:1.4}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

#toast{
  position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom, 12px));
  transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 18px;border-radius:99px;font-size:13px;font-weight:700;
  z-index:40;opacity:0;pointer-events:none;transition:opacity 0.2s;
  max-width:88vw;box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
#toast.on{opacity:1}

/* Auth view */
#auth-view{
  display:none;position:fixed;inset:0;background:var(--bg);z-index:100;
  overflow-y:auto;padding:20px 16px;
}
#auth-view.active{display:flex;align-items:center;justify-content:center}
.auth-box{
  width:100%;max-width:390px;background:var(--paper);padding:24px 20px;
  border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);
}
.auth-box h2{margin:0 0 4px;font-size:22px;font-weight:800;text-align:center}
.auth-box p{margin:0 0 18px;color:var(--muted);font-size:13.5px;font-weight:500;text-align:center}
.divider{
  display:flex;align-items:center;text-align:center;margin:14px 0;
  color:var(--muted);font-size:12px;font-weight:600;
}
.divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--line)}
.divider span{padding:0 8px}
</style>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
<div id="auth-view">
  <div class="auth-box">
    <div style="font-size:44px;text-align:center;margin-bottom:6px">🍼</div>
    <h2 id="auth-title">Sổ của bé</h2>
    <p id="auth-desc">Đăng nhập để theo dõi và bảo vệ dữ liệu bé yêu</p>
    
    <button class="btn btn-google wide" id="btn-google-login">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      Tiếp tục với Google
    </button>

    <div class="divider"><span>hoặc tài khoản Email</span></div>

    <div class="f">
      <label>Email của ba mẹ</label>
      <input id="a_email" type="email" placeholder="bame@yeube.com" autocomplete="email">
    </div>
    <div class="f">
      <label>Mật khẩu</label>
      <input id="a_pass" type="password" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password">
    </div>
    <div class="err" id="a_err"></div>
    <button class="btn wide" id="a_btn_submit">Đăng nhập</button>
    <button class="btn plain wide" id="a_btn_switch" style="margin-top:6px">Chưa có tài khoản? Đăng ký ngay</button>
  </div>
</div>

<!-- GIAO DIỆN CHÍNH -->
<div id="app">
  <header class="top">
    <div class="who"><h1 id="hName">Sổ của bé</h1><p id="hAge"></p></div>
    <button class="icon-btn" data-act="settings" aria-label="Hồ sơ và tài khoản">⚙️</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Điều hướng"><div id="tabs"></div></nav>
<div id="sheet" role="dialog" aria-modal="true"><div class="bd" data-act="close"></div><div class="pn" id="pn"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyDnP8y0JHN_R2r7pJFc_Ef9TJBGWMwqBUc",
  authDomain: "so-cua-be-app.firebaseapp.com",
  projectId: "so-cua-be-app",
  storageBucket: "so-cua-be-app.firebasestorage.app",
  messagingSenderId: "1024832744560",
  appId: "1:1024832744560:web:76acf89f7578eff64098b5",
  measurementId: "G-3H0P44YB3Q"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let userDocRef = null;
let unsubscribeSnapshot = null;

function blank(){
  return {
    baby:{name:"",dob:"",gender:""},
    growth:[],
    feeds:[],
    pumps:[],
    sleeps:[],
    diapers:[],
    fevers:[],
    events:[],
    notes:[]
  };
}

var state = blank();
var ui = {tab:"home", metric:"w", care:"feed"};

// Auth handling
let isSignUpMode = false;
const authView = document.getElementById("auth-view");
const aEmail = document.getElementById("a_email");
const aPass = document.getElementById("a_pass");
const aErr = document.getElementById("a_err");
const aSubmit = document.getElementById("a_btn_submit");
const aSwitch = document.getElementById("a_btn_switch");
const aTitle = document.getElementById("auth-title");
const aDesc = document.getElementById("auth-desc");
const btnGoogle = document.getElementById("btn-google-login");

btnGoogle.onclick = function(){
  const provider = new firebase.auth.GoogleAuthProvider();
  aErr.textContent = "";
  auth.signInWithPopup(provider).catch(function(err){
    if(err.code === "auth/popup-blocked" || err.code === "auth/popup-closed-by-user"){
      auth.signInWithRedirect(provider);
    } else {
      aErr.textContent = "Lỗi Google: " + err.message;
    }
  });
};

aSwitch.onclick = function(){
  isSignUpMode = !isSignUpMode;
  aTitle.textContent = isSignUpMode ? "Tạo tài khoản mới" : "Sổ của bé";
  aDesc.textContent = isSignUpMode ? "Tạo tài khoản để lưu an toàn dữ liệu bé yêu" : "Đăng nhập để theo dõi và bảo vệ dữ liệu bé yêu";
  aSubmit.textContent = isSignUpMode ? "Đăng ký" : "Đăng nhập";
  aSwitch.textContent = isSignUpMode ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
  aErr.textContent = "";
};

aSubmit.onclick = function(){
  const email = aEmail.value.trim();
  const pass = aPass.value.trim();
  if(!email || !pass){ aErr.textContent = "Vui lòng nhập đủ email và mật khẩu."; return; }
  
  aSubmit.disabled = true;
  aSubmit.textContent = "Đang xử lý...";
  aErr.textContent = "";

  const action = isSignUpMode 
    ? auth.createUserWithEmailAndPassword(email, pass)
    : auth.signInWithEmailAndPassword(email, pass);

  action.catch(function(err){
    aSubmit.disabled = false;
    aSubmit.textContent = isSignUpMode ? "Đăng ký" : "Đăng nhập";
    if(err.code === "auth/wrong-password" || err.code === "auth/user-not-found" || err.code === "auth/invalid-credential"){
      aErr.textContent = "Sai email hoặc mật khẩu.";
    } else if(err.code === "auth/email-already-in-use"){
      aErr.textContent = "Email này đã được đăng ký trước đó.";
    } else if(err.code === "auth/weak-password"){
      aErr.textContent = "Mật khẩu cần ít nhất 6 ký tự.";
    } else {
      aErr.textContent = err.message;
    }
  });
};

auth.onAuthStateChanged(function(user){
  if(user){
    currentUser = user;
    authView.classList.remove("active");
    userDocRef = db.collection("users").doc(user.uid);
    
    try {
      var local = localStorage.getItem("baby_cache_" + user.uid);
      if(local) state = Object.assign(blank(), JSON.parse(local));
    } catch(e){}
    render();

    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = userDocRef.onSnapshot(function(doc){
      if(doc.exists){
        state = Object.assign(blank(), doc.data());
        try { localStorage.setItem("baby_cache_" + user.uid, JSON.stringify(state)); } catch(e){}
        render();
      }
    }, function(err){
      console.error(err);
      toast("Lỗi tải dữ liệu");
    });
  } else {
    currentUser = null;
    userDocRef = null;
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    state = blank();
    aSubmit.disabled = false;
    aSubmit.textContent = isSignUpMode ? "Đăng ký" : "Đăng nhập";
    authView.classList.add("active");
  }
});

function save(){
  if(!currentUser || !userDocRef) return;
  try { localStorage.setItem("baby_cache_" + currentUser.uid, JSON.stringify(state)); } catch(e){}
  userDocRef.set(state, { merge: true }).catch(function(err){
    console.error(err);
    toast("Chưa thể lưu lên mạng");
  });
}

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function p2(n){return String(n).padStart(2,"0");}
function isoDate(d){d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function isoDT(d){d=d||new Date();return isoDate(d)+"T"+p2(d.getHours())+":"+p2(d.getMinutes());}
function fmtDate(s){if(!s)return"";var a=s.slice(0,10).split("-");return a[2]+"/"+a[1]+"/"+a[0];}
function fmtShort(s){var a=s.slice(0,10).split("-");return a[2]+"/"+a[1];}
function fmtTime(s){return s.slice(11,16);}
function num(v){v=String(v==null?"":v).trim().replace(",",".");if(v==="")return null;var n=parseFloat(v);return(isFinite(n)&&n>0)?n:NaN;}
function fmtNum(n,dec){
  if(dec === 0) return Math.round(+n).toString();
  var s = (+n).toFixed(dec);
  if(s.indexOf(".") !== -1) s = s.replace(/\.?0+$/, "");
  return s.replace(".", ",");
}
function fmtMin(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;if(h&&r)return h+"g "+r+"p";if(h)return h+"g";return r+"p";}
function dayDiff(a,b){return Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);}
function sleepMin(s){return(new Date(s.end)-new Date(s.start))/60000;}
function ageText(){
  var dob=state.baby.dob;if(!dob)return"Nhập ngày sinh để xem tuổi bé";
  var b=new Date(dob+"T00:00"),n=new Date();n.setHours(0,0,0,0);
  if(b>n)return"Dự sinh "+fmtDate(dob);
  var m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;
  var days=Math.round((n-b)/864e5);
  if(m<1){return days<7?days+" ngày tuổi":Math.floor(days/7)+" tuần "+(days%7?days%7+" ngày":"")+" tuổi";}
  if(m<24)return m+" tháng tuổi";
  return Math.floor(m/12)+" tuổi "+(m%12?m%12+" tháng":"");
}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on");},2400);}
function sortBy(arr,key,desc){return (arr||[]).slice().sort(function(a,b){return(a[key]<b[key]?-1:a[key]>b[key]?1:0)*(desc?-1:1);});}

  var nxt=sortBy((state.events||[]).filter(function(e){return!e.done;}),"date",false)[0];
  h+='<section><div class="sec-title"><span>📅</span> Lịch hẹn sắp tới</div>';
  if(nxt){h+=eventRow(nxt);}else h+='<div class="empty-note"><b>Chưa có lịch hẹn nào</b>Thêm lịch tiêm phòng hoặc khám định kỳ ở tab Lịch hẹn.</div>';
  h+='</section>';

  h+='<section><div class="sec-title"><span>⚡</span> Ghi nhanh một chạm</div><div class="quick">'+
     '<button class="btn ghost" data-act="addFeed">🍼 Bú bình</button>'+
     '<button class="btn ghost" data-act="addPump">🌸 Hút sữa</button>'+
     '<button class="btn ghost" data-act="addDiaper">🧷 Thay tã</button>'+
     '<button class="btn ghost" data-act="addSleep">🌙 Bé ngủ</button>'+
     '<button class="btn ghost" data-act="addFever">🌡️ Cặp nhiệt</button>'+
     '<button class="btn ghost" data-act="addGrowth">📏 Chỉ số</button>'+
     '</div></section>';
  return h;
}

function chart(key){
  var m=METRICS[key],pts=sortBy((state.growth||[]).filter(function(g){return g[key]!=null;}),"date",false);
  if(pts.length<2)return '<div class="empty-note"><b>Cần ít nhất 2 lần đo</b>'+(pts.length?"Đã có 1 số đo. Thêm một lần nữa để xem đường phát triển.":"Ghi lại số đo đầu tiên để bắt đầu theo dõi.")+'</div>';
  var W=340,H=200,L=36,R=16,T=18,B=28;
  var vs=pts.map(function(p){return p[key];}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var pad=(mx-mn)*0.2||mx*0.1||1;mn=Math.max(0,mn-pad);mx=mx+pad;
  var t0=new Date(pts[0].date+"T00:00").getTime(),t1=new Date(pts[pts.length-1].date+"T00:00").getTime(),span=(t1-t0)||1;
  function X(d){return L+(new Date(d+"T00:00").getTime()-t0)/span*(W-L-R);}
  function Y(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var i=0;i<=4;i++){var v=mn+(mx-mn)*i/4,y=Y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+fmtNum(v,m.dec>1?1:0)+'</text>';}
  var path=pts.map(function(p,i){return(i?"L":"M")+X(p.date).toFixed(1)+" "+Y(p[key]).toFixed(1);}).join(" ");
  s+='<path class="ln" d="'+path+'"/>';
  pts.forEach(function(p,i){
    var x=X(p.date),y=Y(p[key]);s+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="5"/>';
    if(pts.length<=8||i===pts.length-1)s+='<text class="val" x="'+x+'" y="'+(y-9)+'" text-anchor="'+(i===0?"start":i===pts.length-1?"end":"middle")+'">'+fmtNum(p[key],m.dec)+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+fmtShort(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(pts[pts.length-1].date)+'</text></svg>';
  return s;
}

function vGrowth(){
  var m=METRICS[ui.metric];
  var h='<div class="seg" role="group">'+["w","h","hc"].map(function(k){return '<button data-act="metric" data-k="'+k+'" aria-pressed="'+(ui.metric===k)+'">'+METRICS[k].label+'</button>';}).join("")+'</div>';
  h+='<section class="card" style="padding:12px 10px 8px">'+chart(ui.metric)+'</section>';
  h+='<section><button class="btn wide" data-act="addGrowth">+ Thêm chỉ số đo mới 📏</button></section>';
  var all=sortBy(state.growth||[],"date",true);
  h+='<section><div class="sec-title"><span>📋</span> Lịch sử đo</div>';
  if(!all.length)h+='<div class="empty-note"><b>Chưa có số đo nào</b>Bấm Thêm chỉ số để ghi cân nặng, chiều cao, vòng đầu.</div>';
  else{h+='<div class="list">'+all.map(function(g){
    var parts=[];["w","h","hc"].forEach(function(k){if(g[k]!=null)parts.push(METRICS[k].label+" "+fmtNum(g[k],METRICS[k].dec)+" "+METRICS[k].unit);});
    return '<div class="row"><div class="main"><div class="t">'+fmtDate(g.date)+'</div><div class="s">'+parts.join(" · ")+(g.note?'<br>'+esc(g.note):"")+'</div></div><button class="x" data-act="del" data-c="growth" data-id="'+g.id+'">✕</button></div>';
  }).join("")+'</div>';}
  return h+'</section>';
}

function vCare(){
  var h='<div class="seg" role="group">'+
    '<button data-act="care" data-k="feed" aria-pressed="'+(ui.care==="feed")+'">🍼 Bé bú</button>'+
    '<button data-act="care" data-k="pump" aria-pressed="'+(ui.care==="pump")+'">🌸 Hút sữa</button>'+
    '<button data-act="care" data-k="diaper" aria-pressed="'+(ui.care==="diaper")+'">🧷 Thay tã</button>'+
    '<button data-act="care" data-k="sleep" aria-pressed="'+(ui.care==="sleep")+'">🌙 Giấc ngủ</button>'+
    '<button data-act="care" data-k="fever" aria-pressed="'+(ui.care==="fever")+'">🌡️ Sốt/Thuốc</button>'+
  '</div>';

  var days={}, arr;

  if(ui.care==="feed"){
    arr=sortBy(state.feeds||[],"dt",true).slice(0,150);
    h+='<section><button class="btn wide" data-act="addFeed">+ Ghi cữ bú của bé 🍼</button></section>';
    arr.forEach(function(f){var d=f.dt.slice(0,10);(days[d]=days[d]||[]).push(f);});
    var keys=Object.keys(days).sort().reverse();
    if(!keys.length)return h+'<div class="empty-note"><b>Chưa có cữ bú nào</b>Ghi nhận lượng sữa bú mỗi ngày của bé.</div>';
    keys.forEach(function(d){
      var tot=days[d].reduce(function(a,f){return a+f.ml;},0);
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (Hôm nay)":"")+'</span><span style="color:var(--primary)">'+fmtNum(tot,0)+' ml · '+days[d].length+' cữ</span></div><div class="list">'+days[d].map(function(f){
        return '<div class="row"><div class="main"><div class="t">'+fmtNum(f.ml,0)+' ml</div><div class="s">'+fmtTime(f.dt)+' · '+esc(f.type)+'</div></div><button class="x" data-act="del" data-c="feeds" data-id="'+f.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }
  else if(ui.care==="pump"){
    arr=sortBy(state.pumps||[],"dt",true).slice(0,150);
    h+='<section><button class="btn wide" data-act="addPump" style="background:var(--coral)">+ Ghi cữ hút sữa của mẹ 🌸</button></section>';
    arr.forEach(function(p){var d=p.dt.slice(0,10);(days[d]=days[d]||[]).push(p);});
    var keys=Object.keys(days).sort().reverse();
    if(!keys.length)return h+'<div class="empty-note"><b>Chưa có cữ hút sữa nào</b>Theo dõi sản lượng sữa hút hàng ngày.</div>';
    keys.forEach(function(d){
      var tot=days[d].reduce(function(a,p){return a+p.total;},0);
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (Hôm nay)":"")+'</span><span style="color:var(--coral)">Tổng '+fmtNum(tot,0)+' ml · '+days[d].length+' cữ</span></div><div class="list">'+days[d].map(function(p){
        var detail = (p.mlL||p.mlR) ? (' (Trái '+p.mlL+'ml | Phải '+p.mlR+'ml)') : '';
        return '<div class="row"><div class="main"><div class="t">'+fmtNum(p.total,0)+' ml'+detail+'</div><div class="s">'+fmtTime(p.dt)+(p.note?(' · '+esc(p.note)):'')+'</div></div><button class="x" data-act="del" data-c="pumps" data-id="'+p.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }
  else if(ui.care==="diaper"){
    arr=sortBy(state.diapers||[],"dt",true).slice(0,150);
    h+='<section><button class="btn wide" data-act="addDiaper" style="background:var(--mint)">+ Ghi nhận thay tã 🧷</button></section>';
    arr.forEach(function(d){var dt=d.dt.slice(0,10);(days[dt]=days[dt]||[]).push(d);});
    var keys=Object.keys(days).sort().reverse();
    if(!keys.length)return h+'<div class="empty-note"><b>Chưa ghi nhận thay tã</b>Theo dõi số lần tè và ị giúp mẹ biết bé bú đủ.</div>';
    keys.forEach(function(d){
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (Hôm nay)":"")+'</span><span style="color:var(--mint)">'+days[d].length+' lần thay tã</span></div><div class="list">'+days[d].map(function(it){
        var badge = it.type==="wet"?"💧 Tã ướt (tè)":(it.type==="dirty"?"💩 Đi ị":"💧💩 Cả tè & ị");
        var extra = it.poo ? (' · '+it.poo) : '';
        return '<div class="row"><div class="main"><div class="t">'+badge+'</div><div class="s">'+fmtTime(it.dt)+extra+(it.note?(' · '+esc(it.note)):'')+'</div></div><button class="x" data-act="del" data-c="diapers" data-id="'+it.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }
  else if(ui.care==="sleep"){
    arr=sortBy(state.sleeps||[],"start",true).slice(0,150);
    h+='<section><button class="btn wide" data-act="addSleep" style="background:var(--purple)">+ Ghi giấc ngủ của bé 🌙</button></section>';
    arr.forEach(function(s){var d=s.start.slice(0,10);(days[d]=days[d]||[]).push(s);});
    var keys=Object.keys(days).sort().reverse();
    if(!keys.length)return h+'<div class="empty-note"><b>Chưa có giấc ngủ nào</b>Theo dõi tổng giờ ngủ mỗi ngày của bé.</div>';
    keys.forEach(function(d){
      var tot=days[d].reduce(function(a,s){return a+sleepMin(s);},0);
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (Hôm nay)":"")+'</span><span style="color:var(--purple)">'+fmtMin(tot)+' · '+days[d].length+' giấc</span></div><div class="list">'+days[d].map(function(s){
        return '<div class="row"><div class="main"><div class="t">'+fmtMin(sleepMin(s))+'</div><div class="s">'+fmtTime(s.start)+' đến '+fmtTime(s.end)+(s.start.slice(0,10)!==s.end.slice(0,10)?" ("+fmtShort(s.end)+")":"")+'</div></div><button class="x" data-act="del" data-c="sleeps" data-id="'+s.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }
  else if(ui.care==="fever"){
    arr=sortBy(state.fevers||[],"dt",true).slice(0,100);
    h+='<section><button class="btn wide danger" data-act="addFever">+ Cặp nhiệt độ / Ghi thuốc 🌡️</button></section>';
    if(!arr.length)return h+'<div class="empty-note"><b>Bé trộm vía khỏe mạnh!</b>Bấm nút trên để theo dõi thân nhiệt và liều thuốc khi bé bị sốt.</div>';
    h+='<div class="list">'+arr.map(function(fe){
      var isHigh = fe.temp >= 38.0;
      return '<div class="row"><div class="main"><div class="t" style="color:'+(isHigh?'var(--danger)':'var(--ink)')+'">'+fe.temp+'°C <span class="chip t-fever">'+esc(fe.pos)+'</span></div>'+
        '<div class="s">'+fmtDate(fe.dt)+' lúc '+fmtTime(fe.dt)+(fe.med?('<br>💊 Thuốc: <b>'+esc(fe.med)+'</b>'):'')+(fe.note?('<br>Ghi chú: '+esc(fe.note)):'')+'</div></div>'+
        '<button class="x" data-act="del" data-c="fevers" data-id="'+fe.id+'">✕</button></div>';
    }).join("")+'</div>';
  }

  return h;
}

var KIND={tiem:["Tiêm phòng","t-tiem"],be:["Khám bé",""],thai:["Khám thai","t-thai"],khac:["Khác","t-khac"]};
function eventRow(e){
  var k=KIND[e.kind]||KIND.khac,left=dayDiff(e.date,isoDate()),when;
  if(e.done)when="Đã xong";else if(left<0)when='<span class="late">Quá hạn '+(-left)+' ngày</span>';else if(left===0)when='<b style="color:var(--primary)">Hôm nay</b>';else when="Còn "+left+" ngày";
  return '<div class="row'+(e.done?" done":"")+'"><button class="check" data-act="toggle" data-id="'+e.id+'" aria-pressed="'+e.done+'" aria-label="Đánh dấu đã xong">✓</button>'+
    '<div class="main"><div class="t">'+esc(e.title)+'</div><div class="s"><span class="chip '+k[1]+'">'+k[0]+'</span>'+fmtDate(e.date)+(e.time?" "+esc(e.time):"")+' · '+when+'</div></div>'+
    '<button class="x" data-act="del" data-c="events" data-id="'+e.id+'">✕</button></div>';
}

function vPlan(){
  var h='<section><button class="btn wide" data-act="addEvent">+ Thêm lịch hẹn / Tiêm phòng 📅</button></section>';
  var up=sortBy((state.events||[]).filter(function(e){return!e.done;}),"date",false),dn=sortBy((state.events||[]).filter(function(e){return e.done;}),"date",true);
  if(!state.events||!state.events.length)return h+'<div class="empty-note"><b>Chưa có lịch hẹn nào</b>Ghi lại lịch tiêm hoặc khám để không bỏ sót.</div>';
  h+='<section><div class="sec-title"><span>⏳</span> Cần làm</div>'+(up.length?'<div class="list">'+up.map(eventRow).join("")+'</div>':'<div class="empty-note">Không còn lịch hẹn nào chờ.</div>')+'</section>';
  if(dn.length)h+='<section><div class="sec-title"><span>✅</span> Đã hoàn thành</div><div class="list">'+dn.map(eventRow).join("")+'</div></section>';
  return h;
}

function vNotes(){
  var h='<section><button class="btn wide" data-act="addNote">+ Viết nhật ký mới 📝</button></section>';
  var arr=sortBy(state.notes||[],"date",true);
  if(!arr.length)return h+'<div class="empty-note"><b>Chưa có nhật ký</b>Lưu lại những khoảnh khắc đáng nhớ của bé.</div>';
  return h+'<div class="list">'+arr.map(function(n){
    return '<div class="row" style="align-items:flex-start"><div class="main"><div class="s" style="font-weight:700;color:var(--primary)">'+fmtDate(n.date)+'</div><div class="t" style="font-weight:600;white-space:pre-wrap;margin-top:3px">'+esc(n.text)+'</div></div><button class="x" data-act="del" data-c="notes" data-id="'+n.id+'">✕</button></div>';
  }).join("")+'</div>';
}

function render(){
  $("#hName").textContent=state.baby.name?(state.baby.name):"Sổ của bé";
  $("#hAge").textContent=ageText()+(state.baby.gender?(" · "+state.baby.gender):"");
  $("#tabs").innerHTML=TABS.map(function(t){return '<button data-act="tab" data-k="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':"")+'><span aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>';}).join("");
  var v={home:vHome,growth:vGrowth,care:vCare,plan:vPlan,notes:vNotes}[ui.tab]();
  $("#view").innerHTML=v;
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),k=t.getAttribute("data-k"),id=t.getAttribute("data-id");
  switch(a){
    case "tab":ui.tab=k;render();window.scrollTo(0,0);break;
    case "metric":ui.metric=k;render();break;
    case "care":ui.care=k;render();break;
    case "addGrowth":fGrowth();break;
    case "addFeed":fFeed();break;
    case "addPump":fPump();break;
    case "addDiaper":fDiaper();break;
    case "addSleep":fSleep();break;
    case "addFever":fFever();break;
    case "addEvent":fEvent();break;
    case "addNote":fNote();break;
    case "settings":fSettings();break;
    case "logout":auth.signOut();closeSheet();break;
    case "close":closeSheet();break;
    case "submit":if(sheetSubmit)sheetSubmit();break;
    case "wipe":confirmSheet("Xoá toàn bộ dữ liệu của tài khoản này?",function(){state=blank();save();closeSheet();render();toast("Đã xoá dữ liệu");});break;
    case "toggle":state.events.forEach(function(ev){if(ev.id===id)ev.done=!ev.done;});save();render();break;
    case "del":
      var c=t.getAttribute("data-c");
      confirmSheet("Xoá mục này?",function(){state[c]=(state[c]||[]).filter(function(x){return x.id!==id;});save();closeSheet();render();toast("Đã xoá");});
      break;
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
})();
</script>
</body>
