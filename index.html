<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ của bé">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sổ của bé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f6f5; --paper:#ffffff; --ink:#1e3347; --muted:#667a8a; --line:#dbe5e8;
  --blue:#2f7a9e; --blue-soft:#dcedf4; --butter:#f7d774; --butter-soft:#fdf3cc;
  --blush:#f2b8b0; --blush-soft:#fbe6e3; --mint:#bfe3d0; --mint-soft:#e1f3ea;
  --danger:#c4473a; --grid:#e6eef0; --btn-ink:#ffffff;
  --shadow:0 1px 0 rgba(30,51,71,.06),0 6px 18px rgba(30,51,71,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a24; --paper:#182533; --ink:#e8f0f5; --muted:#92a6b5; --line:#263748;
    --blue:#6cb6da; --blue-soft:#1d3a4c; --butter:#f2cf66; --butter-soft:#3a3319;
    --blush:#e9a69d; --blush-soft:#3d2724; --mint:#7fc3a5; --mint-soft:#1c3a2e;
    --danger:#ef7d70; --grid:#223244; --btn-ink:#0b1822; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .who{flex:1;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
main{padding:4px 16px 12px}
section{margin-bottom:16px}
.sec-title{font-size:15px;font-weight:700;margin:0 2px 8px}
.card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--paper);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.strip>div{padding:16px 12px 14px;border-right:1px dashed var(--line)}
.strip>div:last-child{border-right:0}
.strip .k{font-size:12.5px;color:var(--muted);font-weight:500}
.strip .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.strip .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.strip .d{font-size:12px;margin-top:6px;color:var(--muted)}
.strip .d.up{color:var(--blue)}
.strip .w .v{color:var(--blue)}
.strip>div.empty .v{color:var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:18px;padding:14px}
.mini.milk{background:var(--butter-soft)}
.mini.sleep{background:var(--blush-soft)}
.mini .k{font-size:12.5px;color:var(--muted);font-weight:500}
.mini .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.mini .v small{font-size:13px;font-weight:600;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--blue);color:var(--btn-ink)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.wide{width:100%}
.btn.danger{background:var(--blush-soft);color:var(--danger)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.plain{background:transparent;color:var(--blue);min-height:38px}
.seg{display:flex;background:var(--blue-soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(30,51,71,.12)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--muted);font-size:10.5px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--butter);stroke:var(--blue);stroke-width:2}
.chart .val{fill:var(--ink);font-weight:700;font-size:11px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .x{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:18px;display:grid;place-items:center}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-right:6px}
.chip.t-tiem{background:var(--mint-soft);color:#2d7a58}
.chip.t-thai{background:var(--blush-soft);color:#b05448}
.chip.t-khac{background:var(--butter-soft);color:#8a6d0b}
.late{color:var(--danger);font-weight:600}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:800}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#134d36}
.done .t{text-decoration:line-through;color:var(--muted)}
.empty-note{text-align:center;color:var(--muted);padding:26px 12px;border:2px dashed var(--line);border-radius:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
.tabs button span{font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.7}
.tabs button[aria-current="page"]{color:var(--blue)}
.tabs button[aria-current="page"] span{filter:none;opacity:1}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(10,20,30,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 14px;font-size:18px;font-weight:800}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);min-height:46px}
.f textarea{min-height:96px;resize:vertical}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 6px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.on{opacity:1}
.cloud-status{font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--line)}
</style>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

// === THAY THÔNG TIN DỰ ÁN CỦA BẠN VÀO ĐÂY ===
const firebaseConfig = {
  apiKey: "AIzaSyDnP8y0JHN_R2r7pJFc_Ef9TJBGWMwqBUc",
  authDomain: "so-cua-be-app.firebaseapp.com",
  projectId: "so-cua-be-app",
  storageBucket: "so-cua-be-app.firebasestorage.app",
  messagingSenderId: "1024832744560",
  appId: "1:1024832744560:web:76acf89f7578eff64098b5",
  measurementId: "G-3H0P44YB3Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "app_data", "baby_profile");

window.saveToCloud = async function(data) {
  try {
    await setDoc(docRef, data);
  } catch (err) {
    console.error("Lỗi đồng bộ Cloud:", err);
  }
};

window.initCloudSync = function(onDataLoaded) {
  onSnapshot(docRef, (snap) => {
    if (snap.exists()) {
      onDataLoaded(snap.data());
    }
  }, (err) => {
    console.warn("Chưa đồng bộ cloud hoặc offline:", err);
  });
};
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="who"><h1 id="hName">Sổ của bé</h1><p id="hAge"></p></div>
    <button class="icon-btn" data-act="settings" aria-label="Cài đặt">⚙️</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="sheet" role="dialog" aria-modal="true"><div class="bd" data-act="close"></div><div class="pn" id="pn"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var KEY="so-cua-be-v1";
function blank(){return {baby:{name:"",dob:"",gender:""},growth:[],feeds:[],sleeps:[],events:[],notes:[]};}
function loadLocal(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);var b=blank();for(var k in b){if(s&&s[k]!==undefined)b[k]=s[k];}return b;}}catch(e){}
  return blank();
}
var state=loadLocal();
var ui={tab:"home",metric:"w",care:"feed"};

function save(syncCloud){
  if(syncCloud===undefined) syncCloud=true;
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(syncCloud && window.saveToCloud){
    window.saveToCloud(state);
  }
}

// Lắng nghe đồng bộ từ Firebase
window.addEventListener("load", function(){
  if(window.initCloudSync){
    window.initCloudSync(function(cloudData){
      if(cloudData){
        var b=blank();
        for(var k in b){if(cloudData[k]!==undefined)b[k]=cloudData[k];}
        state=b;
        save(false);
        render();
        toast("Đã đồng bộ từ đám mây ☁️");
      }
    });
  }
});

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function p2(n){return String(n).padStart(2,"0");}
function isoDate(d){d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function isoDT(d){d=d||new Date();return isoDate(d)+"T"+p2(d.getHours())+":"+p2(d.getMinutes());}
function fmtDate(s){if(!s)return"";var a=s.slice(0,10).split("-");return a[2]+"/"+a[1]+"/"+a[0];}
function fmtShort(s){var a=s.slice(0,10).split("-");return a[2]+"/"+a[1];}
function fmtTime(s){return s.slice(11,16);}
function num(v){v=String(v==null?"":v).trim().replace(",",".");if(v==="")return null;var n=parseFloat(v);return(isFinite(n)&&n>0)?n:NaN;}
function fmtNum(n,dec){var s=(+n).toFixed(dec);s=s.replace(/\.?0+$/,"");return s.replace(".",",");}
function fmtMin(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;if(h&&r)return h+"g "+r+"p";if(h)return h+"g";return r+"p";}
function dayDiff(a,b){return Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);}
function sleepMin(s){return(new Date(s.end)-new Date(s.start))/60000;}
function ageText(){
  var dob=state.baby.dob;if(!dob)return"Nhập ngày sinh của bé để xem tuổi";
  var b=new Date(dob+"T00:00"),n=new Date();n.setHours(0,0,0,0);
  if(b>n)return"Dự sinh "+fmtDate(dob);
  var m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;
  var days=Math.round((n-b)/864e5);
  if(m<1){return days<7?days+" ngày tuổi":Math.floor(days/7)+" tuần "+(days%7?days%7+" ngày":"")+" tuổi";}
  if(m<24)return m+" tháng tuổi";
  return Math.floor(m/12)+" tuổi "+(m%12?m%12+" tháng":"");
}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on");},2400);}
function sortBy(arr,key,desc){return arr.slice().sort(function(a,b){return(a[key]<b[key]?-1:a[key]>b[key]?1:0)*(desc?-1:1);});}

var METRICS={w:{label:"Cân nặng",unit:"kg",dec:2},h:{label:"Chiều cao",unit:"cm",dec:1},hc:{label:"Vòng đầu",unit:"cm",dec:1}};
var TABS=[["home","🏠","Tổng quan"],["growth","📈","Phát triển"],["care","🍼","Ăn & ngủ"],["plan","📅","Lịch"],["notes","📝","Nhật ký"]];

var sheetSubmit=null;
function openSheet(title,body,submitLabel,onSubmit){
  sheetSubmit=onSubmit||null;
  $("#pn").innerHTML='<h2>'+esc(title)+'</h2>'+body+'<div class="err" id="sErr"></div>'+
    (onSubmit?'<button class="btn wide" data-act="submit">'+esc(submitLabel||"Lưu")+'</button>':'')+
    '<button class="btn plain wide" data-act="close" style="margin-top:6px">'+(onSubmit?"Huỷ":"Đóng")+'</button>';
  $("#sheet").classList.add("open");
}
function closeSheet(){$("#sheet").classList.remove("open");sheetSubmit=null;}
function vals(){var o={};document.querySelectorAll("#pn [name]").forEach(function(el){o[el.name]=el.value;});return o;}
function sErr(t){$("#sErr").textContent=t;}

function fGrowth(){
  openSheet("Thêm chỉ số",
   '<div class="f"><label for="g_date">Ngày đo</label><input id="g_date" name="date" type="date" value="'+isoDate()+'"></div>'+
   '<div class="f" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="g_w">Cân nặng (kg)</label><input id="g_w" name="w" inputmode="decimal" placeholder="vd: 6.4"></div>'+
   '<div><label for="g_h">Chiều cao (cm)</label><input id="g_h" name="h" inputmode="decimal" placeholder="vd: 63"></div></div>'+
   '<div class="f"><label for="g_hc">Vòng đầu (cm)</label><input id="g_hc" name="hc" inputmode="decimal" placeholder="Không bắt buộc"></div>'+
   '<div class="f"><label for="g_n">Ghi chú</label><input id="g_n" name="note" placeholder="Không bắt buộc"></div>',
   "Lưu chỉ số",function(){
    var v=vals(),w=num(v.w),h=num(v.h),hc=num(v.hc);
    if(!v.date)return sErr("Chọn ngày đo.");
    if(w===null&&h===null&&hc===null)return sErr("Nhập ít nhất một chỉ số.");
    state.growth.push({id:uid(),date:v.date,w:w,h:h,hc:hc,note:v.note.trim()});
    save();closeSheet();render();toast("Đã lưu chỉ số");
  });
}
function fFeed(){
  openSheet("Ghi cữ sữa",
   '<div class="f"><label for="f_dt">Thời điểm</label><input id="f_dt" name="dt" type="datetime-local" value="'+isoDT()+'"></div>'+
   '<div class="f" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="f_ml">Lượng sữa (ml)</label><input id="f_ml" name="ml" inputmode="numeric" placeholder="vd: 120"></div>'+
   '<div><label for="f_t">Loại sữa</label><select id="f_t" name="type"><option>Sữa mẹ</option><option>Sữa công thức</option><option>Sữa mẹ + công thức</option></select></div></div>',
   "Lưu cữ sữa",function(){
    var v=vals(),ml=num(v.ml);
    if(!v.dt)return sErr("Chọn thời điểm.");
    if(ml===null||ml!==ml)return sErr("Nhập lượng sữa bằng số (ml).");
    state.feeds.push({id:uid(),dt:v.dt,ml:ml,type:v.type});
    save();closeSheet();render();toast("Đã lưu cữ sữa");
  });
}
function fSleep(){
  var now=new Date(),st=new Date(now.getTime()-60*60000);
  openSheet("Ghi giấc ngủ",
   '<div class="f"><label for="s_a">Bắt đầu ngủ</label><input id="s_a" name="start" type="datetime-local" value="'+isoDT(st)+'"></div>'+
   '<div class="f"><label for="s_b">Thức dậy</label><input id="s_b" name="end" type="datetime-local" value="'+isoDT(now)+'"></div>',
   "Lưu giấc ngủ",function(){
    var v=vals();
    if(!v.start||!v.end)return sErr("Nhập giờ bắt đầu và thức dậy.");
    if(new Date(v.end)<=new Date(v.start))return sErr("Giờ thức dậy phải sau giờ bắt đầu.");
    state.sleeps.push({id:uid(),start:v.start,end:v.end});
    save();closeSheet();render();toast("Đã lưu giấc ngủ");
  });
}
function fEvent(){
  openSheet("Thêm lịch hẹn",
   '<div class="f"><label for="e_t">Nội dung</label><input id="e_t" name="title" placeholder="vd: Tiêm mũi 6 trong 1"></div>'+
   '<div class="f"><label for="e_k">Loại</label><select id="e_k" name="kind"><option value="tiem">Tiêm phòng</option><option value="be">Khám bé</option><option value="thai">Khám thai</option><option value="khac">Khác</option></select></div>'+
   '<div class="f" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="e_d">Ngày</label><input id="e_d" name="date" type="date" value="'+isoDate()+'"></div>'+
   '<div><label for="e_h">Giờ</label><input id="e_h" name="time" type="time"></div></div>',
   "Lưu lịch hẹn",function(){
    var v=vals();
    if(!v.title.trim()||!v.date)return sErr("Vui lòng điền đủ thông tin.");
    state.events.push({id:uid(),title:v.title.trim(),kind:v.kind,date:v.date,time:v.time,done:false});
    save();closeSheet();render();toast("Đã lưu lịch hẹn");
  });
}
function fNote(){
  openSheet("Viết nhật ký",
   '<div class="f"><label for="n_d">Ngày</label><input id="n_d" name="date" type="date" value="'+isoDate()+'"></div>'+
   '<div class="f"><label for="n_t">Hôm nay bé thế nào?</label><textarea id="n_t" name="text" placeholder="Bé lẫy được, ăn ngoan..."></textarea></div>',
   "Lưu nhật ký",function(){
    var v=vals();
    if(!v.text.trim())return sErr("Nhập nội dung nhật ký.");
    state.notes.push({id:uid(),date:v.date||isoDate(),text:v.text.trim(),ts:Date.now()});
    save();closeSheet();render();toast("Đã lưu nhật ký");
  });
}
function fSettings(){
  var b=state.baby;
  openSheet("Hồ sơ & Đám mây",
   '<div class="f"><label for="b_n">Tên bé</label><input id="b_n" name="name" value="'+esc(b.name)+'" placeholder="vd: Bống"></div>'+
   '<div class="f" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="b_d">Ngày sinh</label><input id="b_d" name="dob" type="date" value="'+esc(b.dob)+'"></div>'+
   '<div><label for="b_g">Giới tính</label><select id="b_g" name="gender"><option value="">Không chọn</option><option value="Bé trai"'+(b.gender==="Bé trai"?" selected":"")+'>Bé trai</option><option value="Bé gái"'+(b.gender==="Bé gái"?" selected":"")+'>Bé gái</option></select></div></div>'+
   '<p class="hint">⚡ Dữ liệu tự động đồng bộ lên Firebase Cloud khi có kết nối mạng.</p>',
   "Lưu hồ sơ",function(){
    var v=vals();state.baby={name:v.name.trim(),dob:v.dob,gender:v.gender};
    save();closeSheet();render();toast("Đã lưu");
  });
}

function latestOf(key){
  var arr=sortBy(state.growth.filter(function(g){return g[key]!=null;}),"date",true);
  return {cur:arr[0]||null,prev:arr[1]||null};
}
function vHome(){
  var h="";
  if(!state.baby.name&&!state.baby.dob){
    h+='<section class="card" style="background:var(--butter-soft)"><div class="t" style="font-weight:700">Hồ sơ bé</div><p class="hint" style="margin:4px 0 12px">Nhập ngày sinh để theo dõi tuổi và lịch tiêm chuẩn xác.</p><button class="btn small" data-act="settings">Nhập hồ sơ</button></section>';
  }
  h+='<section><div class="strip">';
  ["w","h","hc"].forEach(function(k){
    var m=METRICS[k],L=latestOf(k),cls="",val='<span>--</span>',d='Chưa có số đo';
    if(L.cur){
      val=fmtNum(L.cur[k],m.dec)+'<small>'+m.unit+'</small>';d='Đo '+fmtShort(L.cur.date);
      if(L.prev){var diff=L.cur[k]-L.prev[k];d=(diff>=0?"+":"-")+fmtNum(Math.abs(diff),m.dec)+" "+m.unit;}
    }else cls="empty";
    h+='<div class="'+(k==="w"?"w ":"")+cls+'"><div class="k">'+m.label+'</div><div class="v">'+val+'</div><div class="d '+(L.prev&&L.cur[k]>L.prev[k]?"up":"")+'">'+d+'</div></div>';
  });
  h+='</div></section>';
  var today=isoDate();
  var ml=state.feeds.filter(function(f){return f.dt.slice(0,10)===today;}).reduce(function(a,f){return a+f.ml;},0);
  var sl=state.sleeps.filter(function(s){return s.end.slice(0,10)===today;}).reduce(function(a,s){return a+sleepMin(s);},0);
  h+='<section class="pair"><div class="mini milk"><div class="k">Sữa hôm nay</div><div class="v">'+fmtNum(ml,0)+' <small>ml</small></div></div>'+
     '<div class="mini sleep"><div class="k">Ngủ hôm nay</div><div class="v">'+(sl?fmtMin(sl):"0p")+'</div></div></section>';
  var nxt=sortBy(state.events.filter(function(e){return!e.done;}),"date",false)[0];
  h+='<section><div class="sec-title">Lịch sắp tới</div>';
  if(nxt){h+=eventRow(nxt);}else h+='<div class="empty-note">Chưa có lịch hẹn nào.</div>';
  h+='</section><section><div class="sec-title">Ghi nhanh</div><div class="quick">'+
     '<button class="btn" data-act="addGrowth">+ Chỉ số</button><button class="btn ghost" data-act="addFeed">+ Cữ sữa</button>'+
     '<button class="btn ghost" data-act="addSleep">+ Giấc ngủ</button><button class="btn ghost" data-act="addNote">+ Nhật ký</button></div></section>';
  return h;
}
function chart(key){
  var m=METRICS[key],pts=sortBy(state.growth.filter(function(g){return g[key]!=null;}),"date",false);
  if(pts.length<2)return '<div class="empty-note">Cần ít nhất 2 lần đo để vẽ biểu đồ.</div>';
  var W=340,H=210,L=40,R=16,T=18,B=30;
  var vs=pts.map(function(p){return p[key];}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var pad=(mx-mn)*0.2||mx*0.1||1;mn=Math.max(0,mn-pad);mx=mx+pad;
  var t0=new Date(pts[0].date+"T00:00").getTime(),t1=new Date(pts[pts.length-1].date+"T00:00").getTime(),span=(t1-t0)||1;
  function X(d){return L+(new Date(d+"T00:00").getTime()-t0)/span*(W-L-R);}
  function Y(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
  for(var i=0;i<=4;i++){var v=mn+(mx-mn)*i/4,y=Y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+fmtNum(v,m.dec>1?1:0)+'</text>';}
  var path=pts.map(function(p,i){return(i?"L":"M")+X(p.date).toFixed(1)+" "+Y(p[key]).toFixed(1);}).join(" ");
  s+='<path class="ln" d="'+path+'"/>';
  pts.forEach(function(p,i){
    var x=X(p.date),y=Y(p[key]);s+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="5"/>';
    if(pts.length<=8||i===pts.length-1)s+='<text class="val" x="'+x+'" y="'+(y-10)+'" text-anchor="middle">'+fmtNum(p[key],m.dec)+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+fmtShort(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtShort(pts[pts.length-1].date)+'</text></svg>';
  return s;
}
function vGrowth(){
  var h='<div class="seg">'+["w","h","hc"].map(function(k){return '<button data-act="metric" data-k="'+k+'" aria-pressed="'+(ui.metric===k)+'">'+METRICS[k].label+'</button>';}).join("")+'</div>';
  h+='<section class="card" style="padding:12px 10px 8px">'+chart(ui.metric)+'</section>';
  h+='<section><button class="btn wide" data-act="addGrowth">+ Thêm chỉ số</button></section>';
  var all=sortBy(state.growth,"date",true);
  h+='<section><div class="sec-title">Lịch sử đo</div>';
  if(!all.length)h+='<div class="empty-note">Chưa có số đo nào.</div>';
  else{h+='<div class="list">'+all.map(function(g){
    var parts=[];["w","h","hc"].forEach(function(k){if(g[k]!=null)parts.push(METRICS[k].label+" "+fmtNum(g[k],METRICS[k].dec)+" "+METRICS[k].unit);});
    return '<div class="row"><div class="main"><div class="t">'+fmtDate(g.date)+'</div><div class="s">'+parts.join(" · ")+(g.note?'<br>'+esc(g.note):"")+'</div></div><button class="x" data-act="del" data-c="growth" data-id="'+g.id+'">✕</button></div>';
  }).join("")+'</div>';}
  return h+'</section>';
}
function vCare(){
  var h='<div class="seg"><button data-act="care" data-k="feed" aria-pressed="'+(ui.care==="feed")+'">Sữa</button><button data-act="care" data-k="sleep" aria-pressed="'+(ui.care==="sleep")+'">Giấc ngủ</button></div>';
  var days={},arr;
  if(ui.care==="feed"){
    arr=sortBy(state.feeds,"dt",true).slice(0,200);
    h+='<section><button class="btn wide" data-act="addFeed">+ Ghi cữ sữa</button></section>';
    arr.forEach(function(f){var d=f.dt.slice(0,10);(days[d]=days[d]||[]).push(f);});
    var keys=Object.keys(days).sort().reverse();
    if(!keys.length)return h+'<div class="empty-note">Chưa có cữ sữa nào.</div>';
    keys.forEach(function(d){
      var tot=days[d].reduce(function(a,f){return a+f.ml;},0);
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (hôm nay)":"")+'</span><span>'+fmtNum(tot,0)+' ml · '+days[d].length+' cữ</span></div><div class="list">'+days[d].map(function(f){
        return '<div class="row"><div class="main"><div class="t">'+fmtNum(f.ml,0)+' ml</div><div class="s">'+fmtTime(f.dt)+' · '+esc(f.type)+'</div></div><button class="x" data-act="del" data-c="feeds" data-id="'+f.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }else{
    arr=sortBy(state.sleeps,"start",true).slice(0,200);
    h+='<section><button class="btn wide" data-act="addSleep">+ Ghi giấc ngủ</button></section>';
    arr.forEach(function(s){var d=s.start.slice(0,10);(days[d]=days[d]||[]).push(s);});
    var k2=Object.keys(days).sort().reverse();
    if(!k2.length)return h+'<div class="empty-note">Chưa có giấc ngủ nào.</div>';
    k2.forEach(function(d){
      var tot=days[d].reduce(function(a,s){return a+sleepMin(s);},0);
      h+='<div class="day"><span>'+fmtDate(d)+(d===isoDate()?" (hôm nay)":"")+'</span><span>'+fmtMin(tot)+' · '+days[d].length+' giấc</span></div><div class="list">'+days[d].map(function(s){
        return '<div class="row"><div class="main"><div class="t">'+fmtMin(sleepMin(s))+'</div><div class="s">'+fmtTime(s.start)+' đến '+fmtTime(s.end)+'</div></div><button class="x" data-act="del" data-c="sleeps" data-id="'+s.id+'">✕</button></div>';}).join("")+'</div>';
    });
  }
  return h;
}
var KIND={tiem:["Tiêm phòng","t-tiem"],be:["Khám bé",""],thai:["Khám thai","t-thai"],khac:["Khác","t-khac"]};
function eventRow(e){
  var k=KIND[e.kind]||KIND.khac,left=dayDiff(e.date,isoDate()),when;
  if(e.done)when="Đã xong";else if(left<0)when='<span class="late">Quá hạn '+(-left)+' ngày</span>';else if(left===0)when='<b>Hôm nay</b>';else when="Còn "+left+" ngày";
  return '<div class="row'+(e.done?" done":"")+'"><button class="check" data-act="toggle" data-id="'+e.id+'" aria-pressed="'+e.done+'">✓</button>'+
    '<div class="main"><div class="t">'+esc(e.title)+'</div><div class="s"><span class="chip '+k[1]+'">'+k[0]+'</span>'+fmtDate(e.date)+(e.time?" "+esc(e.time):"")+' · '+when+'</div></div>'+
    '<button class="x" data-act="del" data-c="events" data-id="'+e.id+'">✕</button></div>';
}
function vPlan(){
  var h='<section><button class="btn wide" data-act="addEvent">+ Thêm lịch hẹn</button></section>';
  var up=sortBy(state.events.filter(function(e){return!e.done;}),"date",false),dn=sortBy(state.events.filter(function(e){return e.done;}),"date",true);
  if(!state.events.length)return h+'<div class="empty-note">Chưa có lịch hẹn nào.</div>';
  h+='<section><div class="sec-title">Cần làm</div>'+(up.length?'<div class="list">'+up.map(eventRow).join("")+'</div>':'<div class="empty-note">Không còn lịch chờ.</div>')+'</section>';
  if(dn.length)h+='<section><div class="sec-title">Đã xong</div><div class="list">'+dn.map(eventRow).join("")+'</div></section>';
  return h;
}
function vNotes(){
  var h='<section><button class="btn wide" data-act="addNote">+ Viết nhật ký</button></section>';
  var arr=sortBy(state.notes,"date",true);
  if(!arr.length)return h+'<div class="empty-note">Chưa có nhật ký nào.</div>';
  return h+'<div class="list">'+arr.map(function(n){
    return '<div class="row" style="align-items:flex-start"><div class="main"><div class="s" style="font-weight:600">'+fmtDate(n.date)+'</div><div class="t" style="white-space:pre-wrap">'+esc(n.text)+'</div></div><button class="x" data-act="del" data-c="notes" data-id="'+n.id+'">✕</button></div>';
  }).join("")+'</div>';
}
function render(){
  $("#hName").textContent=state.baby.name?state.baby.name:"Sổ của bé";
  $("#hAge").textContent=ageText()+(state.baby.gender?" · "+state.baby.gender:"");
  $("#tabs").innerHTML=TABS.map(function(t){return '<button data-act="tab" data-k="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':"")+'><span aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>';}).join("");
  var v={home:vHome,growth:vGrowth,care:vCare,plan:vPlan,notes:vNotes}[ui.tab]();
  $("#view").innerHTML=v;
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),k=t.getAttribute("data-k"),id=t.getAttribute("data-id");
  switch(a){
    case "tab":ui.tab=k;render();window.scrollTo(0,0);break;
    case "metric":ui.metric=k;render();break;
    case "care":ui.care=k;render();break;
    case "addGrowth":fGrowth();break;
    case "addFeed":fFeed();break;
    case "addSleep":fSleep();break;
    case "addEvent":fEvent();break;
    case "addNote":fNote();break;
    case "settings":fSettings();break;
    case "close":closeSheet();break;
    case "submit":if(sheetSubmit)sheetSubmit();break;
    case "toggle":state.events.forEach(function(ev){if(ev.id===id)ev.done=!ev.done;});save();render();break;
    case "del":
      var c=t.getAttribute("data-c");
      if(confirm("Xoá mục này?")){
        state[c]=state[c].filter(function(x){return x.id!==id;});
        save();render();toast("Đã xoá");
      }
      break;
  }
});
render();
})();
</script>
</body>
</html>
